packages:
  - 'packages/*'
  - 'tools/*'
  - 'test'
  - 'templates/blank'
  - 'templates/blank-tanstack'
  - 'templates/website'
  - 'templates/ecommerce'

catalog:
  # TS7 provides `tsc`; tools that import `typescript` use the TS6 compatibility API.
  # see: https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/#running-side-by-side-with-typescript-6.0
  '@typescript/native': 'npm:typescript@7.0.2'
  copyfiles: '2.4.1'
  cross-env: '10.1.0'
  dotenv: '16.4.7'
  react: '19.3.1'
  react-dom: '19.3.1'
  typescript: 'npm:@typescript/typescript6@6.0.2'
  zod: '^4.6.0'

updateNotifier: false
symlink: true
nodeLinker: isolated
hoistWorkspacePackages: false # the default in pnpm v9 is true, but that can break our runtime dependency checks
savePrefix: ''
# pnpm v11 defaults this to `install`, which auto-reinstalls when node_modules looks
# stale before any `pnpm run`/`pnpm exec`. The root `prepare` script nests `pnpm turbo`
# inside the outer install's lifecycle, so that check deadlocks against the in-flight
# install (CI hangs until SIGTERM). Restore the v10 behavior.
# See https://github.com/pnpm/pnpm/issues/8865
verifyDepsBeforeRun: false

overrides:
  '@types/request>form-data': '^2.5.6'
  'amazon-cognito-identity-js>js-cookie': '^3.0.7'
  copyfiles: 'catalog:'
  cross-env: 'catalog:'
  dotenv: 'catalog:'
  graphql: '16.8.1'
  react: 'catalog:'
  react-dom: 'catalog:'
  typescript: 'catalog:'

# Replaces pnpm v10 `onlyBuiltDependencies`: packages permitted to run install scripts.
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  '@vercel/git-hooks': true
  better-sqlite3: true
  bufferutil: true
  esbuild: true
  mongodb-memory-server: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  workerd: true

minimumReleaseAgeExclude:
  - '@tanstack/react-router@1.170.44'
  - '@tanstack/react-start-client@1.168.42'
  - '@tanstack/react-start-rsc@0.1.62'
  - '@tanstack/react-start-server@1.167.49'
  - '@tanstack/react-start@1.169.1'
  - '@tanstack/router-core@1.171.37'
  - '@tanstack/router-generator@1.167.43'
  - '@tanstack/router-plugin@1.168.45'
  - '@tanstack/start-client-core@1.170.37'
  - '@tanstack/start-plugin-core@1.171.52'
  - '@tanstack/start-server-core@1.169.42'
  - '@tanstack/start-storage-context@1.167.39'
  - '@next/bundle-analyzer@16.4.2'
  - '@next/env@16.4.2'
  - '@next/eslint-plugin-next@16.4.2'
  - '@next/swc-darwin-arm64@16.4.2'
  - '@next/swc-darwin-x64@16.4.2'
  - '@next/swc-linux-arm64-gnu@16.4.2'
