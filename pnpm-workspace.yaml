packages:
  - 'packages/*'
  - 'tools/*'
  - 'test'
  - 'templates/blank'
  - 'templates/website'
  - 'templates/ecommerce'

catalog:
  copyfiles: '2.4.1'
  cross-env: '7.0.3'
  dotenv: '16.4.7'
  react: '19.2.6'
  react-dom: '19.2.6'
  typescript: '5.7.3'

updateNotifier: false
symlink: true
nodeLinker: isolated
hoistWorkspacePackages: false # the default in pnpm v9 is true, but that can break our runtime dependency checks
savePrefix: ''
# pnpm v11 defaults this to `install`, which auto-reinstalls when node_modules looks
# stale before any `pnpm run`/`pnpm exec`. The root `prepare` script nests `pnpm turbo`
# inside the outer install's lifecycle, so that check deadlocks against the in-flight
# install (CI hangs until SIGTERM). Restore the v10 behavior.
# See https://github.com/pnpm/pnpm/issues/8865
verifyDepsBeforeRun: false

overrides:
  '@hono/node-server@<2.0.5': '>=2.0.5' # GHSA-frvp-7c67-39w9: no patched 1.x exists
  '@types/request>form-data': '^2.5.6'
  'amazon-cognito-identity-js>js-cookie': '^3.0.7'
  copyfiles: 'catalog:'
  cross-env: 'catalog:'
  dotenv: 'catalog:'
  graphql: '16.8.1'
  'mcp-handler>@modelcontextprotocol/sdk': '1.30.0'
  react: 'catalog:'
  react-dom: 'catalog:'
  typescript: 'catalog:'

# Replaces pnpm v10 `onlyBuiltDependencies`: packages permitted to run install scripts.
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  '@vercel/git-hooks': true
  better-sqlite3: true
  bufferutil: true
  esbuild: true
  mongodb-memory-server: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  workerd: true

minimumReleaseAgeExclude:
  - '@next/bundle-analyzer@16.3.3'
  - '@next/env@16.3.3'
  - '@next/eslint-plugin-next@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  - eslint-config-next@16.3.3
  - next@16.3.3
