packages:
  - 'packages/*'
  - 'tools/*'
  - 'test'
  - 'templates/blank'
  - 'templates/blank-tanstack'
  - 'templates/website'
  - 'templates/fullstack'
  - 'templates/ecommerce'

catalog:
  # TS7 provides `tsc`; tools that import `typescript` use the TS6 compatibility API.
  # see: https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/#running-side-by-side-with-typescript-6.0
  '@typescript/native': 'npm:typescript@7.0.2'
  copyfiles: '2.4.1'
  cross-env: '10.1.0'
  dotenv: '16.4.7'
  react: '19.2.6'
  react-dom: '19.2.6'
  typescript: 'npm:@typescript/typescript6@6.0.2'

updateNotifier: false
symlink: true
nodeLinker: isolated
hoistWorkspacePackages: false # the default in pnpm v9 is true, but that can break our runtime dependency checks
savePrefix: ''
# pnpm v11 defaults this to `install`, which auto-reinstalls when node_modules looks
# stale before any `pnpm run`/`pnpm exec`. The root `prepare` script nests `pnpm turbo`
# inside the outer install's lifecycle, so that check deadlocks against the in-flight
# install (CI hangs until SIGTERM). Restore the v10 behavior.
# See https://github.com/pnpm/pnpm/issues/8865
verifyDepsBeforeRun: false

overrides:
  '@babel/core': '^7.29.1'
  '@types/request>form-data': '^2.5.6'
  'amazon-cognito-identity-js>js-cookie': '^3.0.7'
  'brace-expansion@1': '^1.1.18'
  'brace-expansion@2': '^2.1.2'
  'brace-expansion@5': '^5.0.8'
  browserslist: '^4.28.7'
  copyfiles: 'catalog:'
  cross-env: 'catalog:'
  dompurify: '^3.4.14'
  dotenv: 'catalog:'
  esbuild: '^0.25.0'
  fast-uri: '^3.1.6'
  'fast-xml-parser@4': '^4.5.5'
  'fast-xml-parser@5': '^5.10.1'
  graphql: '16.8.1'
  js-yaml: '^4.3.2'
  nanoid: '^3.3.18'
  qs: '^6.16.0'
  react: 'catalog:'
  react-dom: 'catalog:'
  'rollup@3': '^3.30.0'
  sharp: '^0.35.4'
  'tar@7': '^7.5.21'
  typescript: 'catalog:'
  'undici@6': '^6.28.0'
  'undici@7': '^7.29.0'
  uuid: '^11.1.1'
  'ws@8': '^8.21.0'
  'yaml@2': '^2.8.3'

# Replaces pnpm v10 `onlyBuiltDependencies`: packages permitted to run install scripts.
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  '@vercel/git-hooks': true
  better-sqlite3: true
  bufferutil: true
  esbuild: true
  mongodb-memory-server: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  workerd: true

minimumReleaseAgeExclude:
  - '@faceless-ui/modal@3.0.1'
  - '@modelcontextprotocol/client@2.0.0'
  - '@modelcontextprotocol/core@2.0.0'
  - '@modelcontextprotocol/server@2.0.0'
  - '@next/bundle-analyzer@16.3.3'
  - '@next/env@16.3.3'
  - '@next/eslint-plugin-next@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  - next@16.3.3
  - mongoose@9.9.2
  - eslint-config-next@16.3.3
