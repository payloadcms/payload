name: audit-dependencies-branch

on:
  workflow_call:
    inputs:
      ref:
        description: Branch to audit and fix
        type: string
        required: true
      scope:
        description: Which surface to audit (consumer-facing or monorepo)
        type: string
        required: true
      severity:
        description: Minimum severity to report (low, moderate, high, critical)
        type: string
        required: true
      is-default-inputs:
        description: Only runs from main with default inputs may create, update, or close PRs
        type: boolean
        required: true
    secrets:
      OPENAI_API_KEY:
        required: true
      AUDIT_DEPS_APP_CLIENT_ID:
        required: true
      AUDIT_DEPS_APP_PRIVATE_KEY:
        required: true

permissions: {}

env:
  DO_NOT_TRACK: 1 # Disable Turbopack telemetry
  NEXT_TELEMETRY_DISABLED: 1 # Disable Next telemetry

# Trusted tooling and every artifact live under $RUNNER_TEMP, outside the worktree, so a
# patch or Codex cannot overwrite what later steps execute.
jobs:
  precheck:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      fixable: ${{ steps.summarize.outputs.fixable }}
      has_findings: ${{ steps.summarize.outputs.has_findings }}
      has_foreign_commits: ${{ steps.decide.outputs.has_foreign_commits }}
      next_step: ${{ steps.decide.outputs.next_step }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Later jobs check out this commit, so all of them see the base the audit ran on.
      - name: Record base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Tooling comes from the triggering commit: the audited ref (e.g. 3.x) may not have it.
      # actions/checkout only writes under the workspace, so plain git places it in $RUNNER_TEMP.
      - name: Checkout tooling
        env:
          TOOLING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tooling="$RUNNER_TEMP/audit-deps-tooling"
          git clone -q --filter=blob:none --no-checkout --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$tooling"
          git -C "$tooling" sparse-checkout set --no-cone /.github/scripts/audit-deps/ /.agents/skills/audit-dependencies/
          git -C "$tooling" fetch -q --depth=1 origin "$TOOLING_SHA"
          git -C "$tooling" checkout -q --detach "$TOOLING_SHA"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          # The audit resolves each package's dependencies fresh; a full
          # workspace install is not needed.
          pnpm-run-install: false

      - name: Run audit dependencies action
        uses: ./.github/actions/audit-dependencies
        # Findings exit non-zero; the summarize step validates the report instead.
        continue-on-error: true
        with:
          scope: ${{ inputs.scope }}
          severity: ${{ inputs.severity }}
          json: ${{ runner.temp }}/audit_output.json

      - name: Summarize findings
        id: summarize
        env:
          SCOPE: ${{ inputs.scope }}
        run: >-
          node "$RUNNER_TEMP/audit-deps-tooling/.github/scripts/audit-deps/cli.mjs" summarize
          --report="$RUNNER_TEMP/audit_output.json"
          --scope="$SCOPE"

      - name: Decide next step
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FIXABLE: ${{ steps.summarize.outputs.fixable }}
          IS_DEFAULT_INPUTS: ${{ inputs.is-default-inputs }}
          REF: ${{ inputs.ref }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { runPrecheck } = await import(
              `${process.env.RUNNER_TEMP}/audit-deps-tooling/.github/scripts/audit-deps/github.mjs`
            )

            await runPrecheck({
              core,
              fixable: JSON.parse(process.env.FIXABLE),
              github,
              isDefaultInputs: process.env.IS_DEFAULT_INPUTS === 'true',
              owner: context.repo.owner,
              ref: process.env.REF,
              repo: context.repo.repo,
            })

      - name: Upload audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-report-${{ inputs.ref }}
          path: ${{ runner.temp }}/audit_output.json
          if-no-files-found: error
          retention-days: 7

  fix:
    needs: precheck
    if: contains(fromJSON('["create","update","dry-run"]'), needs.precheck.outputs.next_step)
    # codex-action drop-sudo fails on ubuntu-26.04: https://github.com/openai/codex-action/issues/188
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The environment's branch policy keeps OPENAI_API_KEY away from runs on other branches.
    environment: audit-deps
    permissions:
      contents: read
    outputs:
      has_patch: ${{ steps.patch.outputs.has_patch }}
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.precheck.outputs.base_sha }}
          persist-credentials: false

      # Codex reads its inputs from .audit-deps/; this keeps them out of its git status.
      - name: Exclude Codex inputs from git status
        run: echo '.audit-deps/' >> .git/info/exclude

      - name: Checkout tooling
        env:
          TOOLING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tooling="$RUNNER_TEMP/audit-deps-tooling"
          git clone -q --filter=blob:none --no-checkout --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$tooling"
          git -C "$tooling" sparse-checkout set --no-cone /.github/scripts/audit-deps/ /.agents/skills/audit-dependencies/
          git -C "$tooling" fetch -q --depth=1 origin "$TOOLING_SHA"
          git -C "$tooling" checkout -q --detach "$TOOLING_SHA"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          pnpm-run-install: false
          # Untrusted code runs in this job; a post-job cache save would publish a store it could alter.
          pnpm-restore-cache: false

      - name: Download audit report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: audit-report-${{ inputs.ref }}
          path: .audit-deps

      - name: Build prompt
        env:
          FIXABLE: ${{ needs.precheck.outputs.fixable }}
          REF: ${{ inputs.ref }}
          SCOPE: ${{ inputs.scope }}
          SEVERITY: ${{ inputs.severity }}
        run: >-
          node "$RUNNER_TEMP/audit-deps-tooling/.github/scripts/audit-deps/cli.mjs" build-prompt
          --report=.audit-deps/audit_output.json
          --template="$RUNNER_TEMP/audit-deps-tooling/.github/scripts/audit-deps/prompt.md"
          --skill="$RUNNER_TEMP/audit-deps-tooling/.agents/skills/audit-dependencies/SKILL.md"
          --ref="$REF"
          --scope="$SCOPE"
          --severity="$SEVERITY"
          --fixable="$FIXABLE"
          --out=.audit-deps/prompt.md

      - name: Write Codex config
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home"
          cp "$RUNNER_TEMP/audit-deps-tooling/.github/scripts/audit-deps/codex-config.toml" "$RUNNER_TEMP/codex-home/config.toml"
          # An untrusted project skips the checkout's .codex/config.toml, which starts MCP servers
          # (`pnpm dlx @playwright/mcp@latest`) that this run must not load.
          printf '\n[projects."%s"]\ntrust_level = "untrusted"\n' "$GITHUB_WORKSPACE" >> "$RUNNER_TEMP/codex-home/config.toml"

      # Codex can write .git; git after Codex runs only on this pre-Codex snapshot.
      - name: Snapshot git directory
        id: git-snapshot
        run: |
          set -euo pipefail
          tar -C "$GITHUB_WORKSPACE" -cf "$RUNNER_TEMP/git.tar" .git
          echo "sha256=$(sha256sum "$RUNNER_TEMP/git.tar" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      # OPENAI_API_KEY: never reference it in jobs on pull_request_target, or on issue_comment with a checkout of PR code.
      - name: Run Codex
        # Leaves time in the job timeout for the git restore step below.
        timeout-minutes: 25
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .audit-deps/prompt.md
          permission-profile: audit-deps
          codex-home: ${{ runner.temp }}/codex-home
          output-schema-file: ${{ runner.temp }}/audit-deps-tooling/.github/scripts/audit-deps/codex-output.schema.json
          output-file: ${{ runner.temp }}/codex-result.json
          safety-strategy: drop-sudo

      # Runs even when Codex fails or times out, so checkout's post step never runs git on a
      # Codex-written .git. Every repo Codex could reach is removed before the hash verdict.
      - name: Restore git directory
        if: always()
        env:
          GIT_SNAPSHOT_SHA256: ${{ steps.git-snapshot.outputs.sha256 }}
        run: |
          set -euo pipefail
          is_snapshot_intact=false
          if echo "$GIT_SNAPSHOT_SHA256  $RUNNER_TEMP/git.tar" | sha256sum --check --status; then
            is_snapshot_intact=true
          fi

          rm -rf "$GITHUB_WORKSPACE/.git" "$RUNNER_TEMP/audit-deps-tooling"
          find "$GITHUB_WORKSPACE" -mindepth 2 -name .git -prune -exec rm -rf {} +

          if [ "$is_snapshot_intact" != true ]; then
            echo "::error::git snapshot changed during the Codex step"
            exit 1
          fi
          tar -C "$GITHUB_WORKSPACE" -xf "$RUNNER_TEMP/git.tar"

      # The -c flags and env stay as defense in depth; diffing against HEAD also captures staged changes.
      - name: Save patch
        id: patch
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
        run: |
          set -euo pipefail
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c diff.external= -c core.attributesFile=/dev/null \
            diff HEAD --binary --no-ext-diff --no-textconv > "$RUNNER_TEMP/fix.patch"
          if [ -s "$RUNNER_TEMP/fix.patch" ]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload fix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-fix-${{ inputs.ref }}
          path: |
            ${{ runner.temp }}/fix.patch
            ${{ runner.temp }}/codex-result.json
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: [precheck, fix]
    if: needs.fix.outputs.has_patch == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.precheck.outputs.base_sha }}
          persist-credentials: false

      - name: Checkout tooling
        env:
          TOOLING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tooling="$RUNNER_TEMP/audit-deps-tooling"
          git clone -q --filter=blob:none --no-checkout --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$tooling"
          git -C "$tooling" sparse-checkout set --no-cone /.github/scripts/audit-deps/ /.agents/skills/audit-dependencies/
          git -C "$tooling" fetch -q --depth=1 origin "$TOOLING_SHA"
          git -C "$tooling" checkout -q --detach "$TOOLING_SHA"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          pnpm-run-install: false
          # Untrusted code runs in this job; a post-job cache save would publish a store it could alter.
          pnpm-restore-cache: false

      - name: Download audit report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: audit-report-${{ inputs.ref }}
          path: ${{ runner.temp }}/audit-report

      - name: Download fix
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: audit-fix-${{ inputs.ref }}
          path: ${{ runner.temp }}/audit-fix

      - name: Check patch paths
        run: >-
          node "$RUNNER_TEMP/audit-deps-tooling/.github/scripts/audit-deps/cli.mjs" patch-guard
          --cwd="$GITHUB_WORKSPACE"
          --patch="$RUNNER_TEMP/audit-fix/fix.patch"

      - name: Apply patch
        run: git apply --binary "$RUNNER_TEMP/audit-fix/fix.patch"

      - name: Check changed paths
        run: >-
          node "$RUNNER_TEMP/audit-deps-tooling/.github/scripts/audit-deps/cli.mjs" path-guard
          --cwd="$GITHUB_WORKSPACE"

      - name: Check manifest changes
        env:
          SCOPE: ${{ inputs.scope }}
        run: >-
          node "$RUNNER_TEMP/audit-deps-tooling/.github/scripts/audit-deps/cli.mjs" content-guard
          --cwd="$GITHUB_WORKSPACE"
          --report="$RUNNER_TEMP/audit-report/audit_output.json"
          --scope="$SCOPE"

      # Proves the lockfile comes from the base lockfile plus the patched manifests, with no hand edits.
      - name: Check lockfile regenerates cleanly
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          cp pnpm-lock.yaml "$RUNNER_TEMP/codex-lock.yaml"

          if [ "$SCOPE" = "consumer-facing" ]; then
            git show HEAD:pnpm-lock.yaml > pnpm-lock.yaml
            pnpm install --lockfile-only --ignore-scripts
            if ! cmp -s "$RUNNER_TEMP/codex-lock.yaml" pnpm-lock.yaml; then
              echo "::error::pnpm-lock.yaml differs from a regeneration of the base lockfile with the patched manifests"
              exit 1
            fi
            exit 0
          fi

          # Relocks cannot be replayed from the base lockfile, and monorepo scope never opens a PR.
          pnpm install --lockfile-only --ignore-scripts
          if ! diff -q "$RUNNER_TEMP/codex-lock.yaml" pnpm-lock.yaml; then
            echo "::error::pnpm-lock.yaml differs from a clean regeneration of the patched manifests"
            exit 1
          fi

      # Dependency code from here on is unreviewed, so this job holds no secrets and saves no caches.
      # It runs only after every guard passed.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Re-run audit
        uses: ./.github/actions/audit-dependencies
        continue-on-error: true
        with:
          scope: ${{ inputs.scope }}
          severity: ${{ inputs.severity }}
          json: ${{ runner.temp }}/reaudit.json

      - name: Check claimed fixes
        env:
          FIXABLE: ${{ needs.precheck.outputs.fixable }}
        run: >-
          node "$RUNNER_TEMP/audit-deps-tooling/.github/scripts/audit-deps/cli.mjs" check-fixed
          --report="$RUNNER_TEMP/reaudit.json"
          --result="$RUNNER_TEMP/audit-fix/codex-result.json"
          --fixable="$FIXABLE"

      - name: Build core
        run: pnpm run build:core

      - name: Build changed packages
        run: |
          set -euo pipefail
          git diff --name-only -z HEAD -- ':(glob)packages/*/package.json' > "$RUNNER_TEMP/changed-manifests"
          while IFS= read -r -d '' manifest; do
            name="$(jq -r '.name // empty' "$manifest")"
            if [ -z "$name" ]; then
              echo "::error::$manifest has no name"
              exit 1
            fi
            pnpm turbo build --filter="$name"
          done < "$RUNNER_TEMP/changed-manifests"

  open_pr:
    needs: [precheck, fix, verify]
    if: needs.verify.result == 'success' && contains(fromJSON('["create","update"]'), needs.precheck.outputs.next_step)
    runs-on: ubuntu-26.04
    environment: audit-deps
    permissions:
      contents: read
    outputs:
      pr_url: ${{ steps.cpr.outputs.pull-request-url }}
    steps:
      # create-pull-request sets its own credential from its token input, so none is persisted here.
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.precheck.outputs.base_sha }}
          persist-credentials: false

      - name: Checkout tooling
        env:
          TOOLING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tooling="$RUNNER_TEMP/audit-deps-tooling"
          git clone -q --filter=blob:none --no-checkout --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$tooling"
          git -C "$tooling" sparse-checkout set --no-cone /.github/scripts/audit-deps/ /.agents/skills/audit-dependencies/
          git -C "$tooling" fetch -q --depth=1 origin "$TOOLING_SHA"
          git -C "$tooling" checkout -q --detach "$TOOLING_SHA"

      - name: Download audit report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: audit-report-${{ inputs.ref }}
          path: ${{ runner.temp }}/audit-report

      - name: Download fix
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: audit-fix-${{ inputs.ref }}
          path: ${{ runner.temp }}/audit-fix

      # This job pushes, so it repeats the guards instead of trusting the verify job.
      - name: Check patch paths
        run: >-
          node "$RUNNER_TEMP/audit-deps-tooling/.github/scripts/audit-deps/cli.mjs" patch-guard
          --cwd="$GITHUB_WORKSPACE"
          --patch="$RUNNER_TEMP/audit-fix/fix.patch"

      - name: Apply patch
        run: git apply --binary "$RUNNER_TEMP/audit-fix/fix.patch"

      - name: Check changed paths
        run: >-
          node "$RUNNER_TEMP/audit-deps-tooling/.github/scripts/audit-deps/cli.mjs" path-guard
          --cwd="$GITHUB_WORKSPACE"

      - name: Check manifest changes
        env:
          SCOPE: ${{ inputs.scope }}
        run: >-
          node "$RUNNER_TEMP/audit-deps-tooling/.github/scripts/audit-deps/cli.mjs" content-guard
          --cwd="$GITHUB_WORKSPACE"
          --report="$RUNNER_TEMP/audit-report/audit_output.json"
          --scope="$SCOPE"

      - name: Build PR body
        env:
          FIXABLE: ${{ needs.precheck.outputs.fixable }}
          SCOPE: ${{ inputs.scope }}
        run: >-
          node "$RUNNER_TEMP/audit-deps-tooling/.github/scripts/audit-deps/cli.mjs" pr-body
          --cwd="$GITHUB_WORKSPACE"
          --report="$RUNNER_TEMP/audit-report/audit_output.json"
          --scope="$SCOPE"
          --fixable="$FIXABLE"
          --result="$RUNNER_TEMP/audit-fix/codex-result.json"
          --out="$RUNNER_TEMP/pr-body.md"

      # Minted only after every guard passed, so no earlier step can reach the write token.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUDIT_DEPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUDIT_DEPS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ci/audit-deps-fix-${{ inputs.ref }}
          base: ${{ inputs.ref }}
          title: "${{ inputs.ref == '3.x' && 'fix(deps): resolve high severity audit vulnerabilities (3.x)' || 'fix(deps): resolve high severity audit vulnerabilities' }}"
          commit-message: 'fix(deps): resolve high severity audit vulnerabilities'
          body-path: ${{ runner.temp }}/pr-body.md
          labels: dependencies
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          # Git pathspec `**/package.json` does not match the root manifest.
          add-paths: |
            package.json
            **/package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml

  housekeeping:
    needs: precheck
    if: contains(fromJSON('["close","blocked"]'), needs.precheck.outputs.next_step)
    runs-on: ubuntu-26.04
    environment: audit-deps
    permissions:
      contents: read
    steps:
      - name: Checkout tooling
        env:
          TOOLING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tooling="$RUNNER_TEMP/audit-deps-tooling"
          git clone -q --filter=blob:none --no-checkout --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$tooling"
          git -C "$tooling" sparse-checkout set --no-cone /.github/scripts/audit-deps/ /.agents/skills/audit-dependencies/
          git -C "$tooling" fetch -q --depth=1 origin "$TOOLING_SHA"
          git -C "$tooling" checkout -q --detach "$TOOLING_SHA"

      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUDIT_DEPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUDIT_DEPS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Close or comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FIXABLE: ${{ needs.precheck.outputs.fixable }}
          HAS_FOREIGN_COMMITS: ${{ needs.precheck.outputs.has_foreign_commits }}
          NEXT_STEP: ${{ needs.precheck.outputs.next_step }}
          PR_NUMBER: ${{ needs.precheck.outputs.pr_number }}
          REF: ${{ inputs.ref }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { closeStalePr, commentBlocked } = await import(
              `${process.env.RUNNER_TEMP}/audit-deps-tooling/.github/scripts/audit-deps/github.mjs`
            )

            const prNumber = Number(process.env.PR_NUMBER)
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              throw new Error(`invalid PR number: ${process.env.PR_NUMBER}`)
            }

            const { owner, repo } = context.repo

            if (process.env.NEXT_STEP === 'close') {
              await closeStalePr({
                github,
                // Anything but an explicit 'false' keeps the branch.
                hasForeignCommits: process.env.HAS_FOREIGN_COMMITS !== 'false',
                owner,
                prNumber,
                ref: process.env.REF,
                repo,
              })
            } else {
              await commentBlocked({
                fixable: JSON.parse(process.env.FIXABLE),
                github,
                owner,
                prNumber,
                repo,
              })
            }

  status:
    needs: [precheck, fix, verify, open_pr, housekeeping]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Download fix result
        if: needs.fix.result == 'success' && needs.fix.outputs.has_patch == 'false'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: audit-fix-${{ inputs.ref }}
          path: ${{ runner.temp }}/audit-fix

      - name: Report status
        env:
          # Any job other than success or skipped fails the run; precheck must succeed.
          HAS_UNSUCCESSFUL_JOB: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.precheck.result != 'success' }}
          HAS_FINDINGS: ${{ needs.precheck.outputs.has_findings }}
          NEXT_STEP: ${{ needs.precheck.outputs.next_step }}
          PR_NUMBER: ${{ needs.precheck.outputs.pr_number }}
          PR_URL: ${{ needs.open_pr.outputs.pr_url }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          pr_link="$PR_URL"
          if [ -z "$pr_link" ] && [ -n "$PR_NUMBER" ]; then
            pr_link="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PR_NUMBER"
          fi

          line="**$REF**: next step \`${NEXT_STEP:-unknown}\`"
          if [ -n "$pr_link" ]; then
            line="$line, PR: $pr_link"
          fi
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

          # Codex output is untrusted; it reaches the summary only through jq.
          result="$RUNNER_TEMP/audit-fix/codex-result.json"
          if [ -f "$result" ]; then
            {
              printf '\n### Needs a Person\n\n'
              jq -r '.needsPerson[]? | "- \(.advisory) (\(.module), \(.dependency)): \(.reason)" | gsub("[\r\n]+"; " ")' "$result" \
                || echo "codex-result.json could not be read"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$HAS_UNSUCCESSFUL_JOB" = "true" ]; then
            echo "::error::A job failed for $REF"
            exit 1
          fi

          if [ "$HAS_FINDINGS" != "true" ]; then
            exit 0
          fi

          # Findings with a fix PR to review do not fail the run.
          case "$NEXT_STEP" in
            create | update | skip)
              if [ -n "$pr_link" ]; then
                echo "::warning::Audit has findings for $REF; fix PR: $pr_link"
                exit 0
              fi
              ;;
          esac

          echo "::error::Audit has findings for $REF and no fix PR"
          exit 1
