name: post-release-templates

on:
  release:
    types:
      - published
  workflow_dispatch:

env:
  DO_NOT_TRACK: 1 # Disable Turbopack telemetry
  NEXT_TELEMETRY_DISABLED: 1 # Disable Next telemetry

jobs:
  wait_for_release:
    runs-on: ubuntu-26.04
    outputs:
      release_tag: ${{ steps.determine_tag.outputs.release_tag }}
      target_branch: ${{ steps.determine_tag.outputs.target_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout: .github/workflows

      - name: Determine Release Tag
        id: determine_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" == "release" ]; then
            echo "Using tag from release event: $EVENT_TAG"
            RELEASE_TAG="$EVENT_TAG"
          else
            # pull latest tag from github, must match any version except v2. Should match v3, v4, v99, etc.
            echo "Fetching latest tag from github..."
            RELEASE_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v2*')
            echo "Latest tag: $RELEASE_TAG"
          fi

          # Validate shape before fanning out into outputs / downstream shell contexts.
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to proceed: release tag does not match semver: $RELEASE_TAG"
            exit 1
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          # Route v3 releases to the 3.x branch; everything else (v4+) to main.
          if [[ "$RELEASE_TAG" == v3.* ]]; then
            echo "target_branch=3.x" >> "$GITHUB_OUTPUT"
          else
            echo "target_branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait until the release versions resolve on npm registry
        env:
          RELEASE_TAG: ${{ steps.determine_tag.outputs.release_tag }}
        run: |
          ./.github/workflows/wait-until-package-version.sh payload "$RELEASE_TAG"
          ./.github/workflows/wait-until-package-version.sh @payloadcms/translations "$RELEASE_TAG"
          ./.github/workflows/wait-until-package-version.sh @payloadcms/next "$RELEASE_TAG"

  update_templates:
    needs: wait_for_release
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.wait_for_release.outputs.target_branch }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Start PostgreSQL
        id: postgres
        uses: ./.github/actions/start-services
        with:
          database: postgres

      - name: Start MongoDB
        id: mongodb
        uses: ./.github/actions/start-services
        with:
          database: mongodb

        # The template generation script runs import map generation which needs the built payload bin scripts
      - run: pnpm run build:all
        env:
          DO_NOT_TRACK: 1 # Disable Turbopack telemetry
          POSTGRES_URL: ${{ steps.postgres.outputs.POSTGRES_URL }}
          DATABASE_URL: ${{ steps.postgres.outputs.POSTGRES_URL }}

      - name: Update template lockfiles and migrations
        run: pnpm script:gen-templates --payload-version "${RELEASE_TAG#v}"
        env:
          RELEASE_TAG: ${{ needs.wait_for_release.outputs.release_tag }}
          POSTGRES_URL: ${{ steps.postgres.outputs.POSTGRES_URL }}
          DATABASE_URL: ${{ steps.postgres.outputs.POSTGRES_URL }}
          MONGODB_URL: ${{ steps.mongodb.outputs.MONGODB_URL }}

      - name: Save template changes as a patch
        id: patch
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --binary > "$RUNNER_TEMP/templates.patch"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload patch
        if: steps.patch.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: templates-patch
          path: ${{ runner.temp }}/templates.patch
          retention-days: 1

  open_pr:
    needs: [wait_for_release, update_templates]
    if: needs.update_templates.outputs.has_changes == 'true'
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.wait_for_release.outputs.target_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Download patch
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: templates-patch
          path: ${{ runner.temp }}

      - name: Apply patch
        id: apply
        env:
          RELEASE_TAG: ${{ needs.wait_for_release.outputs.release_tag }}
        run: |
          set -euo pipefail
          PATCH="$RUNNER_TEMP/templates.patch"
          git apply --binary "$PATCH"
          OUTSIDE=$(git status --porcelain --untracked-files=all | cut -c4- | grep -v '^templates/' || true)
          if [[ -n "$OUTSIDE" ]]; then
            echo "::error::The templates patch changes files outside templates/:"
            echo "$OUTSIDE"
            exit 1
          fi
          echo "branch=templates/bump-${RELEASE_TAG}-$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ steps.app-token.outputs.token }}
          labels: 'area: templates'
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          commit-message: 'templates: bump templates for ${{ needs.wait_for_release.outputs.release_tag }}'
          branch: ${{ steps.apply.outputs.branch }}
          base: ${{ needs.wait_for_release.outputs.target_branch }}
          assignees: ${{ github.actor }}
          title: 'templates: bump for ${{ needs.wait_for_release.outputs.release_tag }}'
          body: |
            🤖 Automated bump of templates for ${{ needs.wait_for_release.outputs.release_tag }}

            Triggered by user: @${{ github.actor }}

      - name: Approve pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr review "$PR_NUMBER" --approve --repo "$GITHUB_REPOSITORY"

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --repo "$GITHUB_REPOSITORY"
