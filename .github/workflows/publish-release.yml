name: publish-release

on:
  push:
    tags:
      # Only stable v3 tags publish here; prerelease tags never match.
      - 'v3.*.*'
      - '!v3.*-*'

env:
  DO_NOT_TRACK: 1 # Disable Turbopack telemetry
  NEXT_TELEMETRY_DISABLED: 1 # Disable Next telemetry

concurrency:
  group: publish-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish-release-${{ github.ref_name }}
    # A local `pnpm release` commits with [skip ci] and publishes itself, so its tag push
    # must not start a second publish. The CI bump commit never carries [skip ci].
    if: >-
      github.repository == 'payloadcms/payload' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          # Full history and tags are required to resolve the changelog base tag;
          # blob:none keeps that graph without historical file contents.
          fetch-depth: 0
          filter: blob:none
          token: ${{ steps.app-token.outputs.token }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Publish
        run: pnpm release-ci
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true
