name: publish-release

on:
  push:
    tags:
      # Only the canary line publishes here; stable and internal
      # (internal/internal-debug) tags never match.
      # TODO: add 'v4.*-beta.*' (and other lines) when beta releases begin.
      - 'v4.*-canary.*'

env:
  DO_NOT_TRACK: 1 # Disable Turbopack telemetry
  NEXT_TELEMETRY_DISABLED: 1 # Disable Next telemetry

concurrency:
  group: publish-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish-release-${{ github.ref_name }}
    if: github.repository_owner == 'payloadcms'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          # Full history and tags are required to resolve the changelog base tag;
          # blob:none keeps that graph without historical file contents.
          fetch-depth: 0
          filter: blob:none
          token: ${{ steps.app-token.outputs.token }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Publish
        run: pnpm release-ci
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true
