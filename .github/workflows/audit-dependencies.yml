name: audit-dependencies

on:
  # Daily at 2am EST
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Which branch to audit
        type: choice
        required: true
        options:
          - both
          - main
          - 3.x
        default: both
      scope:
        description: Which surface to audit (consumer-facing or monorepo)
        required: false
        default: consumer-facing
      audit-level:
        description: The level of audit to run (low, moderate, high, critical)
        required: false
        default: high
      debug:
        description: Enable debug logging
        required: false
        default: false

# Overlapping scheduled and dispatched runs would race on the same PR branches; queue them.
concurrency:
  group: audit-dependencies
  cancel-in-progress: false

jobs:
  audit:
    name: audit (${{ matrix.ref }})
    strategy:
      fail-fast: false
      matrix:
        # inputs.ref is empty on `schedule`; audit both main and 3.x.
        ref: ${{ fromJSON(inputs.ref && inputs.ref != 'both' && format('["{0}"]', inputs.ref) || '["main","3.x"]') }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/audit-dependencies-branch.yml
    with:
      ref: ${{ matrix.ref }}
      # inputs.* are empty on `schedule`; fall back to the defaults.
      scope: ${{ inputs.scope || 'consumer-facing' }}
      severity: ${{ inputs.audit-level || 'high' }}
      # Only runs from main may change PRs; runs from other branches are dry runs.
      is-default-inputs: ${{ github.ref == 'refs/heads/main' && (inputs.scope || 'consumer-facing') == 'consumer-facing' && (inputs.audit-level || 'high') == 'high' }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AUDIT_DEPS_APP_CLIENT_ID: ${{ secrets.AUDIT_DEPS_APP_CLIENT_ID }}
      AUDIT_DEPS_APP_PRIVATE_KEY: ${{ secrets.AUDIT_DEPS_APP_PRIVATE_KEY }}
